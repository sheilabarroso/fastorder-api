name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código (checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Validação estática (Lint com flake8)
        run: flake8 .

      - name: 5. Testes unitários (pytest)
        run: pytest -v

      - name: 6. Build da imagem Docker
        run: docker build -t fastorder-api:latest .
